<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Orbit Sound ページ側のテスト</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 20px; background: #fff; color: #111; }
  button { font: inherit; padding: 6px 12px; margin: 4px 4px 4px 0; }
  pre { background: #f4f4f6; padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>ページ側のテスト</h1>
<p>テスト用の音（440Hz）を流し、拡張機能と同じ処理を動かします。</p>
<audio id="a1" controls loop></audio>
<div>
  <button id="play">再生（クリック）</button>
  <button id="pause">一時停止</button>
</div>
<pre id="log"></pre>

<script>
// ---- chrome API の偽物 ----
const store = {};
const listeners = [];
window.chrome = {
  storage: { local: {
    get: async (k) => (k in store ? { [k]: store[k] } : {}),
    set: async (o) => Object.assign(store, JSON.parse(JSON.stringify(o)))
  } },
  runtime: { onMessage: { addListener: (fn) => listeners.push(fn) } }
};
// ポップアップから送るのと同じ形でメッセージを送る
window.sendToContent = (msg) => new Promise((resolve) => {
  let async = false;
  for (const fn of listeners) { if (fn(msg, {}, resolve) === true) async = true; }
});
window.__store = store;

// ---- テスト用の音（2秒の 440Hz）を作る ----
function makeWav(seconds = 2, sr = 44100) {
  const n = seconds * sr, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 440 * i / sr) * 0.2 * 32767, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
document.getElementById('a1').src = makeWav();
document.getElementById('play').onclick = () => document.getElementById('a1').play();
document.getElementById('pause').onclick = () => document.getElementById('a1').pause();
window.log = (s) => { document.getElementById('log').textContent += s + '\n'; };
</script>
<script src="../engine.js"></script>
<script src="../content.js"></script>
</body>
</html>
