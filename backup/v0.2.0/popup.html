<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Orbit Sound</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="4.5" fill="currentColor"/>
        <ellipse cx="16" cy="16" rx="12.5" ry="6" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-25 16 16)"/>
        <circle cx="26.6" cy="11" r="2.6" fill="var(--accent)"/>
      </svg>
      <h1>Orbit Sound</h1>
    </div>
    <div class="top-actions">
    <button type="button" id="reset" class="icon-btn" title="初期値に戻す" aria-label="初期値に戻す">↺</button>
    <label class="switch" title="オン / オフ">
      <input type="checkbox" id="enabled" role="switch" aria-label="効果のオン/オフ">
      <span class="track"><span class="thumb"></span></span>
    </label>
    </div>
  </header>

  <p id="status" class="status" data-kind="off">読み込み中…</p>

  <main id="controls">
    <section>
      <h2>プリセット</h2>
      <div id="presets" class="presets"></div>
    </section>

    <section>
      <h2>8D 回転</h2>
      <div class="orbit">
        <div class="viz">
          <canvas id="viz" width="120" height="120" aria-label="音の動き（上から見た図）"></canvas>
          <span id="viz-note" class="viz-note"></span>
        </div>
        <div class="motion-side">
          <div id="motions" class="motions" role="radiogroup" aria-label="回転の種類"></div>
          <p id="motion-desc" class="motion-desc"></p>
        </div>
      </div>
      <div class="field">
        <label for="orbitDepth">回転の深さ</label>
        <output for="orbitDepth" id="orbitDepth-out"></output>
        <input type="range" id="orbitDepth" min="0" max="1" step="0.01">
      </div>
      <div class="field">
        <label for="orbitSeconds">1周の秒数</label>
        <output for="orbitSeconds" id="orbitSeconds-out"></output>
        <input type="range" id="orbitSeconds" min="2" max="20" step="0.5">
      </div>
    </section>

    <section>
      <h2>音量・速さ</h2>
      <div class="field">
        <label for="volume">音量</label>
        <output for="volume" id="volume-out"></output>
        <input type="range" id="volume" min="0" max="3" step="0.05">
      </div>
      <div class="field">
        <label for="speed">再生速度</label>
        <output for="speed" id="speed-out"></output>
        <input type="range" id="speed" min="0.5" max="1.5" step="0.01">
      </div>
    </section>

    <details class="section" id="tone">
      <summary><h2>音質（低音・クリアさ・リバーブ）</h2></summary>
      <div class="field">
        <label for="bass">低音</label>
        <output for="bass" id="bass-out"></output>
        <input type="range" id="bass" min="0" max="12" step="0.5">
      </div>
      <div class="field">
        <label for="clarity">クリアさ</label>
        <output for="clarity" id="clarity-out"></output>
        <input type="range" id="clarity" min="-6" max="10" step="0.5">
      </div>
      <div class="field">
        <label for="reverb">リバーブ量</label>
        <output for="reverb" id="reverb-out"></output>
        <input type="range" id="reverb" min="0" max="1" step="0.01">
      </div>
      <div class="field">
        <label for="roomSize">残響の長さ</label>
        <output for="roomSize" id="roomSize-out"></output>
        <input type="range" id="roomSize" min="0.5" max="6" step="0.1">
      </div>
    </details>

  </main>

  <main id="unsupported" class="unsupported" hidden>
    <p class="big">このページでは使えません</p>
    <p>YouTube・YouTube Music を開いてから、もう一度アイコンを押してください。</p>
    <p class="small">拡張機能を入れる前から開いていたタブは、一度再読み込みしてください。</p>
  </main>

  <script src="engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
