<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Orbit Sound</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <h1>Orbit Sound</h1>
    <span id="chip" class="chip"><i></i><span id="chip-text">読み込み中</span></span>
  </header>

  <main id="controls">
    <!-- 主役：頭と音の動き。背景の色は音色ごとに変わる -->
    <div id="stage" class="stage">
      <canvas id="viz" width="332" height="252" aria-hidden="true"></canvas>
      <p id="notice" class="notice" hidden></p>
      <button id="power" class="head-btn" type="button" aria-pressed="false" aria-label="効果のオン/オフ"></button>
      <div class="stage-bottom">
        <b id="tone-name">そのまま</b>
        <span id="stage-sub" hidden>頭をタップで始める</span>
      </div>
    </div>

    <!-- すりガラスの段：動きと音色 -->
    <section class="module">
      <div id="motions" class="motions" role="radiogroup" aria-label="動き"></div>
      <div id="tones" class="tones" role="radiogroup" aria-label="音色"></div>
    </section>

    <!-- すりガラスの段：音量と回転の速さ -->
    <section class="module">
      <div class="field">
        <label for="volume">音量</label>
        <input type="range" id="volume" min="0" max="3" step="0.05">
        <output id="volume-out" for="volume"></output>
      </div>
      <div class="field">
        <label for="orbitRate">回転の速さ</label>
        <input type="range" id="orbitRate" min="0" max="100" step="1">
        <output id="orbitRate-out" for="orbitRate"></output>
      </div>
      <div class="field beat-row">
        <span id="beat-label" class="field-label">拍</span>
        <div id="beats" class="tones beats" role="radiogroup" aria-labelledby="beat-label"></div>
        <output id="bpm-out" aria-live="polite"></output>
      </div>
      <button id="open-sheet" class="more" type="button" aria-controls="sheet" aria-expanded="false">詳しい調整<span aria-hidden="true">›</span></button>
    </section>

    <!-- 詳しい調整（下からせり上がる板） -->
    <div id="scrim" class="scrim" hidden></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="sheet-head">
        <h2 id="sheet-title">詳しい調整</h2>
        <button id="close-sheet" class="close" type="button">閉じる</button>
      </div>
      <div class="field">
        <label for="orbitDepth">回転の深さ</label>
        <input type="range" id="orbitDepth" min="0" max="1" step="0.01">
        <output id="orbitDepth-out" for="orbitDepth"></output>
      </div>
      <div class="field">
        <label for="spatial">立体感の強さ</label>
        <input type="range" id="spatial" min="0" max="1" step="0.01">
        <output id="spatial-out" for="spatial"></output>
      </div>
      <div class="field">
        <label for="speed">再生速度</label>
        <input type="range" id="speed" min="0.5" max="1.5" step="0.01">
        <output id="speed-out" for="speed"></output>
      </div>
      <div class="field">
        <label for="bass">低音</label>
        <input type="range" id="bass" min="0" max="12" step="0.5">
        <output id="bass-out" for="bass"></output>
      </div>
      <div class="field">
        <label for="clarity">クリアさ</label>
        <input type="range" id="clarity" min="-6" max="10" step="0.5">
        <output id="clarity-out" for="clarity"></output>
      </div>
      <div class="field">
        <label for="reverb">リバーブ量</label>
        <input type="range" id="reverb" min="0" max="1" step="0.01">
        <output id="reverb-out" for="reverb"></output>
      </div>
      <div class="field">
        <label for="roomSize">残響の長さ</label>
        <input type="range" id="roomSize" min="0.5" max="6" step="0.1">
        <output id="roomSize-out" for="roomSize"></output>
      </div>
      <div class="check">
        <span class="check-title">左右チェック</span>
        <button id="check-beep" class="ghost" type="button" title="パソコンとイヤホンが、左右を分けて出せるかを確かめます">ピッ音で</button>
        <button id="check-page" class="ghost" type="button" title="拡張機能が、動画の音を左右に動かせているかを確かめます">動画の音で</button>
      </div>
      <p id="check-msg" class="check-msg" aria-live="polite">押すと、左耳 → 右耳の順に聞こえます</p>
      <div class="sheet-foot">
        <button id="reset" class="ghost" type="button">すべて初期値に戻す</button>
        <span class="hint">🎧 ヘッドホン推奨</span>
      </div>
    </section>
  </main>

  <main id="unsupported" class="unsupported" hidden>
    <p class="big">このページでは使えません</p>
    <p>YouTube・YouTube Music を開いてから、もう一度アイコンを押してください。</p>
    <p class="small">拡張機能を入れる前から開いていたタブは、一度再読み込みしてください。</p>
  </main>

  <script src="engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
